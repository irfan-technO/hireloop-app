{% extends "accounts/base.html" %}

{% block content %}
<div class="space-y-6">
    <div>
        <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Forgot Password?</h2>
        <p class="text-xs sm:text-sm text-slate-500 mt-1">Enter your registered email to receive a 6-digit OTP code.</p>
    </div>

    {% if messages %}
        <div class="space-y-2">
            {% for message in messages %}
                <div class="p-3 text-xs rounded-xl border flex items-center gap-2
                            {% if message.tags == 'error' %}bg-rose-50 text-rose-700 border-rose-200{% else %}bg-emerald-50 text-emerald-700 border-emerald-200{% endif %}">
                    <i class="bi bi-info-circle-fill"></i>
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" action="{% url 'forgot_password' %}" class="space-y-4">
        {% csrf_token %}
        <div class="space-y-1.5">
            <label for="id_email" class="block text-xs font-semibold text-slate-700">Email Address</label>
            <input type="email" id="id_email" name="email" placeholder="name@example.com" required
                   class="w-full px-4 py-3 text-sm rounded-xl bg-slate-50 border border-slate-200 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all">
        </div>

        <button type="submit" 
                class="w-full py-3.5 px-4 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] rounded-xl shadow-lg shadow-indigo-600/30 transition-all duration-200">
            Send OTP Code
        </button>
    </form>

    <p class="text-center text-xs text-slate-500">
        Remembered your password? 
        <a href="{% url 'login' %}" class="font-bold text-indigo-600 hover:text-indigo-700 underline decoration-2 underline-offset-4">Log in</a>
    </p>
</div>
{% endblock %}
