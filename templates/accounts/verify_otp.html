{% extends "accounts/base.html" %}

{% block content %}
<div class="space-y-6">
    <div>
        <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Verify OTP</h2>
        <p class="text-xs sm:text-sm text-slate-500 mt-1">Enter the 6-digit OTP code sent to your email.</p>
    </div>

    {% if messages %}
        <div class="space-y-2">
            {% for message in messages %}
                <div class="p-3 text-xs rounded-xl border flex items-center gap-2
                            {% if message.tags == 'error' %}bg-rose-50 text-rose-700 border-rose-200{% else %}bg-emerald-50 text-emerald-700 border-emerald-200{% endif %}">
                    <i class="bi bi-info-circle-fill"></i>
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" action="{% url 'verify_otp' %}" class="space-y-4">
        {% csrf_token %}
        <div class="space-y-1.5">
            <label for="id_otp" class="block text-xs font-semibold text-slate-700">Enter 6-Digit OTP</label>
            <input type="text" id="id_otp" name="otp" maxlength="6" placeholder="123456" required
                   class="w-full px-4 py-3 text-center text-xl tracking-[0.5em] font-mono font-bold rounded-xl bg-slate-50 border border-slate-200 text-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all">
        </div>

        <button type="submit" 
                class="w-full py-3.5 px-4 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] rounded-xl shadow-lg shadow-indigo-600/30 transition-all duration-200">
            Verify OTP
        </button>
    </form>

    <div class="flex justify-between items-center text-xs text-slate-500">
        <a href="{% url 'forgot_password' %}" class="font-medium text-slate-600 hover:text-indigo-600">Resend OTP</a>
        <a href="{% url 'login' %}" class="font-bold text-indigo-600 hover:text-indigo-700">Back to Login</a>
    </div>
</div>
{% endblock %}
